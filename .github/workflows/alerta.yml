
name: Notificacion ITLA

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Ejecutar Hola Mundo
        run: node index.js

      - name: Enviar notificacion
        run: |
          curl -H "Title: Practica ITLA" \
               -d "Hola Mundo. Se ha subido codigo a la rama main." \
               https://ntfy.sh/devops-itla
